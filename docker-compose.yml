services:
  otbr:
    image: 'openthread/border-router:latest'
    network_mode: host
    privileged: true
    environment:
      - 'OT_RCP_DEVICE=spinel+hdlc+uart:///dev/ttyUSB_thread?uart-baudrate=460800'
      - OT_INFRA_IF=enp0s25
      - OT_THREAD_IF=wpan0
      - OT_LOG_LEVEL=7
      # The web UI has no authentication and controls the border router, so bind
      # it to loopback only. Reach it with: ssh -L 8081:127.0.0.1:8081 <host>
      - OT_WEB_LISTEN_ADDR=127.0.0.1
      - OT_WEB_LISTEN_PORT=8081
      # The REST API is consumed by Home Assistant, so it must stay reachable on
      # the host. The host firewall restricts it to loopback + the Docker subnet.
      - OT_REST_LISTEN_ADDR=0.0.0.0
      - OT_REST_LISTEN_PORT=8082
    devices:
      - '/dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_d64c43c71ef4ef11859ebd1b6d9880ab-if00-port0:/dev/ttyUSB_thread'
    volumes:
      - '/data/smart-home/otbr:/data'
  matter-server:
    image: 'ghcr.io/home-assistant-libs/python-matter-server:stable'
    network_mode: host
    security_opt:
      - 'apparmor:unconfined'
    volumes:
      - '/data/smart-home/matter:/data'
      - '/run/dbus:/run/dbus:ro'
    command: '--storage-path /data --primary-interface enp0s25 --bluetooth-adapter 0'
    healthcheck:
      test:
        - CMD-SHELL
        - 'python3 -c "import socket; socket.create_connection((\"localhost\", 5580), 3)" || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  homeassistant:
    image: 'ghcr.io/home-assistant/home-assistant:latest'
    environment:
      - SERVICE_URL_HOMEASSISTANT_8123
      - 'TZ=${TZ:-UTC}'
    # Traefik reaches HA over the compose network. Coolify publishes the
    # container's 8123 on 0.0.0.0 itself, so binding 8123 here too fails with
    # "port is already allocated". Break-glass first-time setup uses a high
    # loopback port instead:
    #   ssh -L 18123:127.0.0.1:18123 <host>   ->   http://localhost:18123
    ports:
      - '127.0.0.1:18123:8123'
    volumes:
      - '/data/smart-home/assistant:/config'
      - '/run/dbus:/run/dbus:ro'
    privileged: true
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:8123'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  timescaledb:
    image: 'timescale/timescaledb:latest-pg17'
    container_name: matter-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: matter
      POSTGRES_USER: matter
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set in .env}'
      TZ: '${TZ:-UTC}'
    volumes:
      - '/data/smart-home/timescaledb:/var/lib/postgresql/data'
      - './ingest/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro'
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U matter -d matter'
      interval: 5s
      timeout: 3s
      retries: 20
  grafana:
    image: 'grafana/grafana:13.2.1'
    container_name: matter-grafana
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    # The /data mount does not support changing ownership, so Grafana must run as root here.
    user: '0:0'
    environment:
      GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:?set in .env}'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      TZ: '${TZ:-UTC}'
    volumes:
      - '/data/smart-home/grafana:/var/lib/grafana'
      - './grafana/provisioning:/etc/grafana/provisioning:ro'
      - './grafana/dashboards:/var/lib/grafana/dashboards:ro'
    # Traefik serves Grafana over the compose network. Coolify publishes the
    # container's 3000 on 0.0.0.0 itself, so break-glass uses a high loopback
    # port: ssh -L 13000:127.0.0.1:13000 <host>  ->  http://localhost:13000
    ports:
      - '127.0.0.1:13000:3000'
  naming:
    build: ./naming
    container_name: matter-naming
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      MATTER_DSN: 'postgresql://matter:${POSTGRES_PASSWORD}@timescaledb:5432/matter'
    # This UI has no auth of its own, so it is served through Traefik with HTTP
    # BasicAuth (labels below). Assign a domain to this service in Coolify so
    # Traefik generates a router for it. Coolify publishes the container's 8080
    # on 0.0.0.0 itself, so break-glass uses a high loopback port:
    #   ssh -L 18080:127.0.0.1:18080 <host>   ->   http://localhost:18080
    ports:
      - '127.0.0.1:18080:8080'
    labels:
      - 'traefik.http.middlewares.naming-auth.basicauth.users=${NAMING_BASICAUTH_USERS}'
      - 'coolify.traefik.middlewares=naming-auth'
  ingest:
    build: ./ingest
    container_name: matter-ingest
    restart: unless-stopped
    network_mode: host
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      MATTER_WS_URL: '${MATTER_WS_URL:-ws://localhost:5580/ws}'
      MATTER_DSN: 'postgresql://matter:${POSTGRES_PASSWORD}@localhost:5432/matter'
      MATTER_LOG_LEVEL: '${MATTER_LOG_LEVEL:-INFO}'
      MATTER_DEBUG_JSONL: '${MATTER_DEBUG_JSONL:-}'
    volumes:
      - '/data/smart-home/ingest:/data'
